services:

  project-service:
    build:
      context: ../services/project-service
      dockerfile: Dockerfile
    container_name: project-service
    env_file:
      - ../services/project-service/.env
    depends_on:
      - project-db
    ports:
      - "4001:3000"

  project-db:
    image: postgres:16
    container_name: project-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_service
    volumes:
      - project_pg_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    env_file:
      - ../.env
    depends_on:
      - user-db
    ports:
      - "4002:3000"

  user-db:
    image: postgres:16
    container_name: user-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_service
    volumes:
      - user_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  gateway-service:
    build:
      context: ../services/gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    env_file:
      - ../services/gateway-service/.env
    depends_on:
      - project-service
    ports:
      - "4000:3000"

volumes:
  project_pg_data:
  user_pg_data:
